  const EVENT_LABEL = { a_caminho: "A caminho da obra", inicio: "Obra iniciada", pausa: "Obra pausada", retomada: "Obra retomada", fim: "Obra concluída", problema: "Problema informado" };
  const origemLabel = o => ({ historico: "histórico real da equipe", perfil: "produtividade do perfil", referencia: "valor de referência — revise", misto: "perfil + referência" }[o] || o);

  /* ---------------- reschedule (shared validator) ---------------- */
  function moveDialog(id, preset) {
    const c = getCtx(), job = c.jobsById[id];
    if (!job) return;
    const a = job.agenda || {};
    const cur = job._members || [];
    const opts = (c.installers || []).filter(i => i.ativo !== false);
    const d = openDialog({
      title: "Remarcar obra", sub: h(job.cliente),
      body: `<div class="stack"><div class="form-grid">
        <div class="field span-3"><label for="mvDate">Início</label><input class="input" type="date" id="mvDate" value="${h((preset && preset.date) || a.inicio || c.today)}"></div>
        <div class="field span-3"><label for="mvHora">Horário</label><input class="input" type="time" id="mvHora" value="${h(a.hora || "08:00")}"></div>
        <div class="field span-6"><label for="mvInst">Instalador</label><select class="select" id="mvInst" ${job.equipeId ? "disabled" : ""}>${job.equipeId ? `<option>${h(crewLabel(job, c))} (equipe — altere no formulário)</option>` : `<option value="">Manter (${h(cur.map(instName).join(", ") || "sem instalador")})</option>${opts.map(i => `<option value="${h(i.id)}" ${preset && preset.inst === i.id ? "selected" : ""}>${h(i.nome)}</option>`).join("")}`}</select></div></div>
        <div id="mvCheck" class="stack tight"></div>
        <div class="field" id="mvWhyWrap" hidden><label for="mvWhy">Justificativa para aceitar o conflito *</label><textarea class="textarea" id="mvWhy"></textarea></div></div>`,
      foot: `<button class="btn" data-x type="button">Cancelar</button><button class="btn primary" type="button" id="mvOk">Salvar nova data</button>`
    });
    const proposal = () => {
      const inst = !job.equipeId && $("#mvInst", d).value;
      const ids = inst ? (cur.length > 1 ? [inst, ...cur.filter(x => x !== inst)].slice(0, cur.length) : [inst]) : cur;
      return { ...job, instaladorIds: job.equipeId ? job.instaladorIds : ids, agenda: { ...a, inicio: $("#mvDate", d).value, hora: $("#mvHora", d).value || "08:00" } };
    };
    const check = () => {
      const p = proposal(), issues = C.validateJob(p, c), al = C.allocate(p, c);
      $("#mvCheck", d).innerHTML = (al.fim ? `<p class="small muted">Término previsto: ${h(C.fmtDate(al.fim))} (${al.blocks.length} dia(s) de trabalho)</p>` : "") + (issues.length ? issues.map(issueHTML).join("") : `<div class="issue tone-success">${ic("circle-check", 16)}<span>Sem conflitos com a agenda atual.</span></div>`);
      $("#mvWhyWrap", d).hidden = !C.hasErrors(issues);
      if (C.hasErrors(issues)) {
        const alt = C.recommend(p, c, 1).candidatos[0];
        if (alt) $("#mvCheck", d).insertAdjacentHTML("beforeend", `<p class="small">Sugestão: <b>${h(alt.nome)}</b> está livre ${alt.data === p.agenda.inicio ? "nesta data" : "a partir de " + h(C.fmtDate(alt.data))} (${alt.score}/100).</p>`);
      }
      return issues;
    };
    ["#mvDate", "#mvHora", "#mvInst"].forEach(s => $(s, d).addEventListener("change", check));
    check();
    $("#mvOk", d).addEventListener("click", async () => {
      const issues = check(), p = proposal();
      if (!C.isDate(p.agenda.inicio)) return toast("Escolha uma data válida.", true);
      const why = $("#mvWhy", d).value.trim();
      if (C.hasErrors(issues) && why.length < 5) { toast("Explique por que o conflito deve ser aceito.", true); $("#mvWhy", d).focus(); return; }
      const patch = { agenda: p.agenda, instaladorIds: p.instaladorIds, hist: [...(job.hist || []), { t: new Date().toISOString(), txt: `Remarcada para ${C.fmtDate(p.agenda.inicio)} ${p.agenda.hora}${p.instaladorIds.join() !== cur.join() ? " · " + p.instaladorIds.map(instName).join(", ") : ""}` }].slice(-40) };
      if (C.hasErrors(issues)) patch.overrides = [...(job.overrides || []), { at: new Date().toISOString(), por: S.uid, motivo: why, conflitos: issues.filter(i => i.severity === "erro").map(i => i.msg) }];
      if (p.status === "rascunho") patch.status = "agendada";
      await guard(() => Store.saveJob(job.id, patch), "Obra remarcada.");
      d.close();
    });
  }

  /* ---------------- shell, routing, roles ---------------- */
  const ROUTES = {
    central: { title: "Central de Obras", icon: "layout-dashboard", group: "Operação" },
    agenda: { title: "Agenda Semanal", icon: "calendar-days", group: "Operação" },
    instaladores: { title: "Instaladores", icon: "hard-hat", group: "Operação" },
    instalacoes: { title: "Instalações", icon: "hammer", group: "Obras" },
    manutencoes: { title: "Manutenções", icon: "wrench", group: "Obras" },
    desempenho: { title: "Desempenho da Equipe", icon: "chart-column", group: "Gestão" },
    ajustes: { title: "Configurações", icon: "settings", group: "Gestão" },
    "minha-agenda": { title: "Minha Agenda", icon: "calendar-check", field: true },
    quadro: { title: "Quadro de Obras", icon: "layout-dashboard", viewer: true },
    "sem-acesso": { title: "Agenda de obras", icon: "info", none: true }
  };
  const App = window.App = {
    C, Store, S, $, $$, h, ic, badge, toast, openDialog, confirmDialog, guard, getCtx, instName, crewLabel, matsLabel, statusBadges, jobCard, dateTile,
    emptyHTML, issueHTML, openJob, moveDialog, jobAction, longDay, shortDay, relDay, initials, origemLabel, EVENT_LABEL,
    views: {}, route: "central", canEdit: false, role: null, ui: {}
  };

  function allowedRoutes() {
    const r = S.role;
    if (r === "admin" || r === "coordenador") return ["central", "agenda", "instaladores", "instalacoes", "manutencoes", "desempenho", "ajustes"];
    if (r === "instalador") return ["minha-agenda"];
    if (r === "visualizador") return ["quadro"];
    return ["sem-acesso"];
  }
  function resolveRoute() {
    let r = location.hash.slice(1);
    if (r === "celular" || r === "pc") { setUi(r === "celular" ? "mobile" : "pc"); r = ""; }
    const allowed = allowedRoutes();
    App.route = allowed.includes(r) ? r : allowed[0];
  }
  /* desktop vs phone, same rule as the Entregas app: device first, then width */
  let uiPref = ""; try { uiPref = localStorage.getItem("mercatto:versao") || ""; } catch (e) { }
  function autoUi() { const ua = navigator.userAgent; return /Android|iPhone|iPod|Mobile|Windows Phone|iPad|Tablet/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua)) || innerWidth < 1024 ? "mobile" : "pc"; }
  App.isMobile = () => (uiPref || autoUi()) === "mobile";
  function setUi(v) { uiPref = v; try { if (v) localStorage.setItem("mercatto:versao", v); else localStorage.removeItem("mercatto:versao"); } catch (e) { } applyUi(); }
  App.setUi = setUi; App.uiPref = () => uiPref;
  function applyUi() {
    const m = App.isMobile(), el = document.documentElement;
    el.classList.toggle("ui-mobile", m); el.classList.toggle("ui-pc", !m);
    $("#uiSwitch").innerHTML = m ? ic("monitor", 15) + "Abrir versão para computador" : ic("smartphone", 15) + "Abrir versão para celular";
    if (!m) closeMenu();
  }
  const openMenu = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); };
  const closeMenu = () => { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); };

  function renderNav() {
    const allowed = allowedRoutes(), c = S.mode === "loading" ? null : getCtx();
    const counts = {};
    if (c && (S.role === "admin" || S.role === "coordenador")) {
      counts.instalacoes = c.jobs.filter(j => j.tipo !== "manutencao" && !["concluida", "cancelada"].includes(j.status)).length;
      counts.manutencoes = c.jobs.filter(j => j.tipo === "manutencao" && !["concluida", "cancelada"].includes(j.status)).length;
    }
    let group = null, html = "";
    for (const r of allowed) {
      const R = ROUTES[r];
      if (R.group && R.group !== group) { group = R.group; html += `<div class="nav-label">${h(group)}</div>`; }
      html += `<a href="#${r}"${App.route === r ? ' aria-current="page"' : ""}>${ic(R.icon, 18)}<span>${h(R.title)}</span>${counts[r] ? `<span class="count">${counts[r]}</span>` : ""}</a>`;
    }
    $("#nav").innerHTML = html;
    const admin = S.role === "admin" || S.role === "coordenador";
    $("#bottomNav").innerHTML = admin ? `
      <a href="#central"${App.route === "central" ? ' aria-current="page"' : ""}>${ic("layout-dashboard", 22)}Central</a>
      <a href="#agenda"${App.route === "agenda" ? ' aria-current="page"' : ""}>${ic("calendar-days", 22)}Agenda</a>
      ${App.canEdit ? `<button type="button" data-new aria-label="Nova obra"><span class="fab">${ic("plus", 22)}</span></button>` : ""}
      <a href="#instaladores"${App.route === "instaladores" ? ' aria-current="page"' : ""}>${ic("hard-hat", 22)}Equipe</a>
      <button type="button" data-menu>${ic("ellipsis", 22)}Mais</button>` : "";
    $("#bottomNav").hidden = !admin;
    $("#btnNewTop").hidden = !(admin && App.canEdit);
    $("#btnBell").parentElement.hidden = !admin;
    // sync indicator
    const sy = $("#syncState"), d = Store.describeMode(S.mode);
    let cls = "", txt;
    if (S.mode === "local") { cls = "local"; txt = "Só neste navegador"; }
    else if (!S.online) { cls = "bad"; txt = S.pending ? `Sem conexão · ${S.pending} alteração(ões) não sincronizada(s)` : "Sem conexão"; }
    else if (S.pending) { cls = "warn"; txt = `Salvando ${S.pending} alteração(ões)…`; }
    else if (S.lastError) { cls = "bad"; txt = "Falha ao salvar — tente de novo"; }
    else txt = S.mode === "db" ? "Sincronizado com a equipe" : "Conectando…";
    sy.className = "sync " + cls; sy.innerHTML = `<span class="dot"></span><span>${h(txt)}</span>`; sy.title = d.label;
    if (S.me && S.me.name) { $("#meName").textContent = S.me.name; $("#meAvatar").textContent = initials(S.me.name); }
    $("#meRole").textContent = S.role ? (C.ROLES[S.role] || { label: "Sem acesso" }).label : "Carregando…";
  }

  let lastRoute = null;
  function render(force) {
    App.role = S.role;
    App.canEdit = (S.role === "admin" || S.role === "coordenador") && S.canWrite;
    document.body.classList.toggle("ro", !App.canEdit);
    resolveRoute();
    renderNav();
    const R = ROUTES[App.route];
    $("#tbTitle").textContent = R.title;
    $("#tbSub").textContent = longDay(C.today());
    const el = $("#content");
    const ready = S.mode === "local" || (S.mode === "db" && S.role && (S.role === "instalador" || S.role === "visualizador" || S.role === "sem_acesso" || (S.loaded.obras && S.loaded.instaladores && S.loaded.equipes && S.loaded.cfg)));
    if (!ready) { el.innerHTML = `<div class="stack loose"><div class="stats">${'<div class="skeleton" style="height:64px"></div>'.repeat(8)}</div><div class="skeleton" style="height:280px"></div></div>`; return; }
    const view = App.views[App.route === "sem-acesso" ? "semAcesso" : App.route.replace(/-([a-z])/g, (m, x) => x.toUpperCase())];
    const routeChanged = lastRoute !== App.route;
    lastRoute = App.route;
    if (view) view(el, { routeChanged: routeChanged || force });
    if (detailDlg) renderDetail();
    renderBell();
    if (S.mode === "db" && (S.role === "admin" || S.role === "coordenador") && !getCtx().virtual) scheduleProjections();
  }
  App.render = render;

  /* ---------------- alerts bell ---------------- */
  function renderBell() {
    if (!(S.role === "admin" || S.role === "coordenador")) return;
    const c = getCtx();
    const list = activeAlerts(c);
    const high = list.filter(a => a.severity === "alta").length;
    $("#bellDot").hidden = !list.length; $("#bellDot").textContent = list.length;
    const pop = $("#bellPop");
    if (!pop.hidden) $("#bellList").innerHTML = list.length ? list.slice(0, 30).map(alertRow).join("") : emptyHTML("circle-check", "Nenhum alerta em aberto");
    $("#btnBell").setAttribute("aria-label", `Alertas: ${list.length} em aberto, ${high} prioritários`);
  }
  function activeAlerts(c) { const dis = (S.alertState && S.alertState.dispensados) || {}; return C.buildAlerts(c, { problemas: problemEvents(c) }).filter(a => !dis[a.key]); }
  function problemEvents(c) {
    return (c.events || []).filter(e => e.tipo === "problema" && !(c.jobsById[e.jobId] && (c.jobsById[e.jobId].atividade || []).some(x => x.id === e.id && x.resolvido))).map(e => ({ id: e.id, jobId: e.jobId, nota: e.nota, cliente: (c.jobsById[e.jobId] || {}).cliente || "Obra" }));
  }
  const SEVTONE = { alta: "danger", media: "warning", baixa: "neutral" };
  function alertRow(a) {
    return `<div class="rowitem" style="cursor:default"><span class="ic si-${SEVTONE[a.severity]}">${ic(a.severity === "alta" ? "triangle-alert" : "info", 16)}</span>
      <span class="grow stack" style="gap:1px"><span class="small strong">${h(a.tipo)}</span><span class="tiny muted">${h(a.msg)}</span></span>
      <span class="row" style="gap:4px">${alertActionBtn(a)}${App.canEdit ? `<button class="btn ghost icon sm" type="button" data-dismiss="${h(a.key)}" title="Dispensar" aria-label="Dispensar alerta">${ic("x", 14)}</button>` : ""}</span></div>`;
  }
  function alertActionBtn(a) {
    const c = getCtx(), job = a.jobId && c.jobsById[a.jobId];
    if (a.acao === "whatsapp_confirmar" && job && job.fone) return `<a class="btn sm" target="_blank" rel="noopener noreferrer" href="${h(C.waLink(job.fone, C.waTemplates(job, c).cliente[0].text))}">Confirmar</a>`;
    if (a.acao === "atribuir" && job) return `<button class="btn sm" type="button" data-edit="${h(job.id)}" data-step="2">Atribuir</button>`;
    if (a.acao === "reagendar" && job) return `<button class="btn sm" type="button" data-move="${h(job.id)}">Remarcar</button>`;
    if (a.acao === "criar_manutencao" && job) return `<button class="btn sm" type="button" data-maint="${h(job.id)}">Criar</button>`;
    if (a.acao === "realocar" && a.instId) return `<a class="btn sm" href="#agenda" data-agenda-inst="${h(a.instId)}">Agenda</a>`;
    if (job) return `<button class="btn sm" type="button" data-open="${h(job.id)}">Resolver</button>`;
    return "";
  }
  App.activeAlerts = activeAlerts; App.alertRow = alertRow;
  async function dismiss(key) {
    const st = { dispensados: { ...((S.alertState && S.alertState.dispensados) || {}), [key]: { at: new Date().toISOString(), por: S.uid || null } } };
    // keep the map small: drop dismissals older than 60 days
    const cutoff = new Date(Date.now() - 60 * 864e5).toISOString();
    for (const [k, v] of Object.entries(st.dispensados)) if (v.at < cutoff) delete st.dispensados[k];
    await guard(() => Store.setAlertState(st), "Dispensado.");
  }

  /* ---------------- projections for installers and viewers ---------------- */
  let projTimer = 0;
  function scheduleProjections() { clearTimeout(projTimer); projTimer = setTimeout(publishProjections, 2000); }
  async function publishProjections() {
    if (S.mode !== "db" || !(S.role === "admin" || S.role === "coordenador")) return;
    const c = getCtx();
    if (c.virtual) return;
    for (const p of S.acessos.pessoas || []) {
      try {
        if (p.papel === "instalador" && p.instaladorId) await Store.writeProjection(p.id, installerProjection(p, c));
        else if (p.papel === "visualizador") await Store.writeProjection(p.id, viewerProjection(c));
      } catch (e) { /* surfaced by the sync indicator */ }
    }
  }
  function slimJob(j, c, full) {
    const al = C.allocate(j, c);
    const o = { id: j.id, cliente: j.cliente, tipo: j.tipo, status: j.status, prio: j.prio || "", itens: j.itens || [], servico: j.servico || "", agenda: { inicio: (j.agenda || {}).inicio || "", hora: (j.agenda || {}).hora || "" }, fimPrevisto: al.fim, dias: al.blocks.map(b => ({ d: b.date, s: C.fromMin(b.start), e: C.fromMin(b.end) })), bairro: (j.endereco || {}).bairro || "", equipe: crewLabel(j, c) };
    if (full) Object.assign(o, { fone: j.fone || "", endereco: j.endereco || {}, obs: j.obs || "", prontidao: C.readiness(j, c).missing, real: j.real || {} });
    return o;
  }
  function installerProjection(p, c) {
    const since = C.addDays(c.today, -14);
    const mine = c.jobs.filter(j => (j._members || []).includes(p.instaladorId) && j.status !== "rascunho" && j.status !== "cancelada" && (j.status !== "concluida" || (j.real && j.real.fim && C.tsParts(j.real.fim).date >= since)));
    const inst = c.installersById[p.instaladorId] || {};
    return { papel: "instalador", instaladorId: p.instaladorId, nome: inst.nome || "", cidade: c.cfg.city, obras: mine.map(j => slimJob(j, c, true)), atualizado: new Date().toISOString().slice(0, 16) };
  }
  function viewerProjection(c) {
    const since = C.addDays(c.today, -30);
    const jobs = c.jobs.filter(j => j.status !== "rascunho" && (j.status !== "concluida" || (j.real && j.real.fim && C.tsParts(j.real.fim).date >= since))).slice(0, 400);
    return { papel: "visualizador", instaladores: (c.installers || []).filter(i => i.ativo !== false).map(i => ({ id: i.id, nome: i.nome, status: C.installerStatus(i, c, c.events).label })), obras: jobs.map(j => slimJob(j, c, false)), atualizado: new Date().toISOString().slice(0, 16) };
  }

  /* ---------------- global events ---------------- */
  document.addEventListener("click", async e => {
    const t = e.target;
    if (t.closest("a[target=_blank]")) return;
    const pop = t.closest("[data-wamenu]");
    if (pop) { const p = pop.parentElement.querySelector("[data-wapop]"); p.hidden = !p.hidden; return; }
    if (!t.closest("#bellPop") && !t.closest("#btnBell")) $("#bellPop").hidden = true;
    if (t.closest("#btnBell")) { $("#bellPop").hidden = !$("#bellPop").hidden; renderBell(); return; }
    if (t.closest("[data-menu]") || t.closest("#btnMenu")) { openMenu(); return; }
    if (t.closest("#scrim") || t.closest("#nav a")) closeMenu();
    if (t.closest("#uiSwitch")) { setUi(App.isMobile() ? "pc" : "mobile"); render(true); return; }
    const b = (sel) => t.closest(sel);
    let x;
    if (b("[data-new]")) { if (!getCtx().virtual) App.openForm(null, App.ui.newPreset ? App.ui.newPreset() : null); else toast("Atualize os dados (em Configurações) antes de criar obras.", true); return; }
    if ((x = b("[data-edit]"))) { if (detailDlg && x.closest("dialog") === detailDlg) detailDlg.close(); App.openForm(x.dataset.edit, null, Number(x.dataset.step || 0)); return; }
    if ((x = b("[data-move]"))) { moveDialog(x.dataset.move); return; }
    if ((x = b("[data-act]"))) { jobAction(x.dataset.id, x.dataset.act); return; }
    if ((x = b("[data-del]"))) {
      const job = getCtx().jobsById[x.dataset.del];
      if (job && await confirmDialog(`Excluir a obra de ${job.cliente}? Isso não pode ser desfeito.`, "Excluir obra", true)) { await guard(() => Store.deleteJob(job.id), "Obra excluída."); if (detailDlg) detailDlg.close(); }
      return;
    }
    if ((x = b("[data-reopen]"))) { const job = getCtx().jobsById[x.dataset.reopen]; await guard(() => Store.saveJob(job.id, { status: "andamento", real: { ...(job.real || {}), fim: null } }), "Obra reaberta."); return; }
    if ((x = b("[data-maint]"))) { const job = getCtx().jobsById[x.dataset.maint]; if (detailDlg) detailDlg.close(); App.openForm(null, { tipo: "manutencao", manutencaoDe: job.id, cliente: job.cliente, fone: job.fone, endereco: job.endereco, itens: (job.itens || []).map(i => ({ ...i, qtd: null })), servico: "Retorno: " + ((job.conclusao || {}).pendencias || ""), instaladorIds: job._members || [], retrabalho: true }); return; }
    if ((x = b("[data-dismiss]"))) { dismiss(x.dataset.dismiss); return; }
    if ((x = b("[data-open]"))) { openJob(x.dataset.open); return; }
  });
  document.addEventListener("change", async e => {
    const r = e.target.closest("[data-ready]");
    if (r && detailId) {
      const job = getCtx().jobsById[detailId];
      await guard(() => Store.saveJob(job.id, { prontidao: { ...(job.prontidao || {}), [r.dataset.ready]: r.checked } }));
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("#bellPop").hidden = true; });
  window.addEventListener("hashchange", () => { closeMenu(); render(true); window.scrollTo(0, 0); });
  window.addEventListener("resize", () => { if (!uiPref) { const was = document.documentElement.classList.contains("ui-mobile"); if (was !== App.isMobile()) { applyUi(); render(true); } } });

  App.boot = async function () {
    applyUi();
    let v = 0;
    Store.subscribe(() => { S._v = ++v; ctx = null; render(); });
    render();
    await Store.connect();
    render(true);
    setInterval(() => { ctx = null; render(); }, 5 * 60 * 1000);
  };
})();
</script>
<script>/* Job creation / edit wizard: Cliente → Serviço → Agenda → Prontidão → Confirmação. */
(function () {
  "use strict";
  const A = window.App, C = A.C, Store = A.Store, { $, $$, h, ic, badge } = A;
  const STEPS = ["Cliente", "Serviço", "Agenda", "Prontidão", "Confirmação"];
  const SERVICOS = ["Retirar e recolocar peças para acesso a encanamento", "Retirar e recolocar peças para acesso à parte elétrica", "Troca de peça danificada", "Ajuste de acabamento ou rodapé", "Reparo por infiltração", "Revisão geral"];

  let W = null, step = 0, dlg = null, original = null, recState = null;

  function blank(preset) {
    const c = A.getCtx();
    return {
      tipo: "instalacao", status: "agendada", prio: "", cliente: "", fone: "",
      endereco: { completo: "", bairro: "", ref: "", lat: null, lng: null },
      itens: [{ mat: "", label: "", qtd: null, unidade: "m²" }], complexidade: "normal", servico: "", obs: "",
      equipeNecessaria: 1, instaladorIds: [], equipeId: null,
      agenda: { inicio: "", hora: "08:00", horas: null, horasManual: false },
      prontidao: {}, atividade: [], hist: [], ...(preset || {}),
      ...(preset && preset.endereco ? { endereco: { completo: "", bairro: "", ref: "", lat: null, lng: null, ...preset.endereco } } : {}),
      ...(preset && preset.agenda ? { agenda: { inicio: "", hora: "08:00", horas: null, horasManual: false, ...preset.agenda } } : {})
    };
  }

  A.openForm = function (id, preset, startStep) {
    const c = A.getCtx();
    if (!A.canEdit) return;
    original = id ? c.jobsById[id] : null;
    W = original ? JSON.parse(JSON.stringify(original)) : blank(preset);
    delete W._members;
    if (!W.itens || !W.itens.length) W.itens = [{ mat: "", qtd: null, unidade: "m²" }];
    W.agenda = { hora: "08:00", ...(W.agenda || {}) };
    W.endereco = { completo: "", bairro: "", ref: "", ...(W.endereco || {}) };
    step = startStep || 0; recState = null;
    dlg = A.openDialog({
      title: original ? (W.tipo === "manutencao" ? "Editar manutenção" : "Editar obra") : (W.tipo === "manutencao" ? "Nova manutenção" : "Nova obra"),
      sub: "Só o nome do cliente é obrigatório. O resto pode ser completado depois — salve como rascunho a qualquer momento.",
      wide: true, body: "", foot: "", onClose: () => { dlg = null; }
    });
    renderAll();
  };

  function renderAll() {
    if (!dlg) return;
    $(".modal-body", dlg).innerHTML = `<div class="stack loose"><nav class="steps" aria-label="Etapas">${STEPS.map((s, i) => `<button type="button" data-step-go="${i}" ${i === step ? 'aria-current="step"' : ""} class="${i < step ? "done" : ""}"><span class="n">${i < step ? "✓" : i + 1}</span><span class="t">${s}</span></button>`).join("")}</nav><div id="wzBody"></div><div id="wzCheck" class="stack tight"></div></div>`;
    $("#wzBody", dlg).innerHTML = [stepCliente, stepServico, stepAgenda, stepProntidao, stepConfirmar][step]();
    $(".modal-foot", dlg).innerHTML = `
      ${step > 0 ? `<button class="btn" type="button" data-prev>${ic("chevron-left", 16)}Voltar</button>` : `<button class="btn" type="button" data-x>Cancelar</button>`}
      <span class="spacer"></span>
      <button class="btn" type="button" data-save="draft">Salvar rascunho</button>
      ${step < STEPS.length - 1 ? `<button class="btn primary" type="button" data-next>Continuar${ic("chevron-right", 16)}</button>` : `<button class="btn primary" type="button" data-save="confirm">${ic("check", 16)}${original && original.status !== "rascunho" ? "Salvar alterações" : "Confirmar obra"}</button>`}`;
    bind();
    if (step === 2 || step === 4) renderCheck();
    else $("#wzCheck", dlg).innerHTML = "";
    const first = $("#wzBody input, #wzBody select", dlg);
    if (first && !A.isMobile() && step === 0) first.focus();
  }

  /* ---------- step 1: customer ---------- */
  function stepCliente() {
    const e = W.endereco;
    return `<div class="form-grid">
      <div class="field span-6"><label for="fCli">Nome do cliente *</label><input class="input" id="fCli" data-k="cliente" value="${h(W.cliente)}" autocomplete="off"><span class="error" id="errCli" hidden></span></div>
      <div class="field span-3"><label for="fFone">WhatsApp</label><input class="input" id="fFone" data-k="fone" type="tel" inputmode="tel" placeholder="(92) 99123-4567" value="${h(W.fone)}"></div>
      <div class="field span-3"><label for="fBairro">Bairro</label><input class="input" id="fBairro" data-k="endereco.bairro" list="dlBairros" value="${h(e.bairro)}" placeholder="Ex.: Adrianópolis"><datalist id="dlBairros">${[...new Set(A.getCtx().jobs.map(j => (j.endereco || {}).bairro).filter(Boolean))].sort().map(b => `<option value="${h(b)}">`).join("")}</datalist></div>
      <div class="field span-6"><label for="fEnd">Endereço completo</label><input class="input" id="fEnd" data-k="endereco.completo" value="${h(e.completo)}" placeholder="Rua, número, condomínio, apartamento"></div>
      <div class="field span-3"><label for="fRef">Ponto de referência</label><input class="input" id="fRef" data-k="endereco.ref" value="${h(e.ref)}"></div>
      <div class="field span-3"><label for="fCoord">Coordenadas do local</label><input class="input" id="fCoord" placeholder="Cole o link do Google Maps ou -3.10, -60.02" value="${C.hasCoords(e) ? `${e.lat}, ${e.lng}` : ""}"><span class="hint" id="coordHint">${C.hasCoords(e) ? "Localização definida." : "Opcional. Melhora as sugestões por proximidade."}</span></div>
    </div>`;
  }
  /* ---------- step 2: service ---------- */
  function stepServico() {
    return `<div class="stack">
      <div class="field"><span class="label">Tipo</span><div class="chip-row" role="group" aria-label="Tipo">
        <button type="button" class="chip" data-set="tipo" data-v="instalacao" aria-pressed="${W.tipo === "instalacao"}">${ic("hammer", 15)}Instalação</button>
        <button type="button" class="chip" data-set="tipo" data-v="manutencao" aria-pressed="${W.tipo === "manutencao"}">${ic("wrench", 15)}Manutenção</button></div></div>
      ${W.tipo === "manutencao" ? `<div class="field"><label for="fServ">O que precisa ser feito</label><input class="input" id="fServ" data-k="servico" list="dlServ" value="${h(W.servico)}"><datalist id="dlServ">${SERVICOS.map(s => `<option value="${h(s)}">`).join("")}</datalist>
        <label class="check"><input type="checkbox" data-kb="retrabalho" ${W.retrabalho ? "checked" : ""}> Retrabalho de uma obra da Mercatto (conta no desempenho)</label></div>` : ""}
      <div class="stack tight"><span class="label">Materiais e quantidades</span>
        ${W.itens.map((it, i) => `<div class="row wrap" data-item="${i}" style="gap:8px">
          <select class="select" data-it="mat" aria-label="Material" style="flex:2 1 220px;width:auto"><option value="">Escolha o material…</option>${C.MATERIALS.map(m => `<option value="${m.id}" ${it.mat === m.id ? "selected" : ""}>${h(m.label)}</option>`).join("")}</select>
          <input class="input" data-it="qtd" type="number" min="0" step="0.1" inputmode="decimal" aria-label="Quantidade" placeholder="Quantidade" value="${it.qtd != null ? h(it.qtd) : ""}" style="flex:1 1 110px;width:auto">
          <select class="select" data-it="unidade" aria-label="Unidade" style="flex:0 1 100px;width:auto">${C.UNITS.map(u => `<option ${it.unidade === u ? "selected" : ""}>${u}</option>`).join("")}</select>
          ${it.mat === "outro" ? `<input class="input" data-it="label" placeholder="Descreva o material" value="${h(it.label || "")}" style="flex:2 1 200px;width:auto">` : ""}
          ${W.itens.length > 1 ? `<button class="btn ghost icon sm" type="button" data-rm-item="${i}" aria-label="Remover material">${ic("x", 15)}</button>` : ""}
          ${it.unidadeInferida ? `<span class="tiny" style="color:var(--warning-text)">Unidade deduzida da agenda antiga — confirme.</span>` : ""}
        </div>`).join("")}
        ${W.materialOriginal ? `<span class="hint tiny muted">Na agenda antiga estava: “${h(W.materialOriginal)}${W.qtdOriginal ? " — " + h(W.qtdOriginal) : ""}”.</span>` : ""}
        <div><button class="btn sm" type="button" data-add-item>${ic("plus", 15)}Adicionar material</button></div></div>
      <div class="form-grid">
        <div class="field span-3"><span class="label">Complexidade</span><div class="segmented" role="group" aria-label="Complexidade">${Object.entries(C.COMPLEXITY).map(([k, v]) => `<button type="button" data-set="complexidade" data-v="${k}" aria-pressed="${W.complexidade === k}">${h(v.label)}</button>`).join("")}</div></div>
        <div class="field span-3"><label for="fEq">Instaladores necessários</label><input class="input" id="fEq" type="number" min="1" max="6" data-k="equipeNecessaria" data-num value="${h(W.equipeNecessaria || 1)}"></div>
        <div class="field span-6"><span class="label">Urgência</span><div class="chip-row">${Object.entries(C.PRIORITY).map(([k, v]) => `<button type="button" class="chip" data-set="prio" data-v="${k}" data-toggle aria-pressed="${W.prio === k}">${h(v.label)}</button>`).join("")}</div></div>
        <div class="field span-6"><label for="fObs">Instruções para a equipe</label><textarea class="textarea" id="fObs" data-k="obs" placeholder="Medidas, acesso, cuidados, pendências…">${h(W.obs)}</textarea></div>
      </div></div>`;
  }
  /* ---------- step 3: scheduling ---------- */
  function stepAgenda() {
    const c = A.getCtx(), a = W.agenda, est = C.estimateDuration(W, c);
    const teams = c.teams || [];
    const actives = (c.installers || []).filter(i => i.ativo !== false);
    return `<div class="stack">
      <div class="card pad stack tight">
        <div class="row between wrap"><span class="h-section">Duração estimada</span>${est.horas ? badge(est.origem === "referencia" ? "warning" : "success", A.origemLabel(est.origem)) : ""}</div>
        ${est.horas ? `<div><b style="font-size:20px">${C.fmtNum(est.horas)} h</b> <span class="muted">≈ ${C.fmtNum(est.dias)} dia(s) de trabalho</span></div><div class="tiny muted">${h(est.detalhe)}</div>` : `<div class="small" style="color:var(--warning-text)">${h(est.motivo)}</div>`}
        <label class="check"><input type="checkbox" id="fManual" ${a.horasManual ? "checked" : ""}> Definir a duração manualmente</label>
        <div class="row" id="manualWrap" ${a.horasManual ? "" : "hidden"}><input class="input" type="number" min="0.5" step="0.5" id="fHoras" value="${h(a.horasManual ? a.horas : est.horas || "")}" style="max-width:140px"><span class="small muted">horas de trabalho da equipe</span></div>
      </div>
      <div class="form-grid">
        <div class="field span-2"><label for="fIni">Início desejado</label><input class="input" type="date" id="fIni" data-k="agenda.inicio" value="${h(a.inicio)}"><span class="hint">Deixe em branco para receber a primeira data livre.</span></div>
        <div class="field span-2"><label for="fHora">Horário de chegada</label><input class="input" type="time" id="fHora" data-k="agenda.hora" value="${h(a.hora || "08:00")}"></div>
        <div class="field span-2"><span class="label">Situação</span><div class="segmented" role="group" aria-label="Situação">
          <button type="button" data-set="status" data-v="aguardando" aria-pressed="${W.status === "aguardando"}">Aguarda cliente</button>
          <button type="button" data-set="status" data-v="agendada" aria-pressed="${W.status === "agendada" || W.status === "rascunho"}">Confirmada</button></div></div>
      </div>
      <div class="card"><div class="card-head"><span class="h-section">${ic("sparkles", 16)} Sugerir melhor instalador</span><button class="btn accent sm" type="button" data-recommend>${recState ? "Recalcular" : "Calcular sugestões"}</button></div>
        <div class="card-body stack" id="recBox">${recState ? recHTML() : `<p class="small muted">Analisa especialidade no material, disponibilidade no período inteiro, proximidade (quando há localização), produtividade e histórico. Instaladores sem o material ou sem vaga são descartados antes da pontuação.</p>`}</div></div>
      <div class="stack tight"><span class="label">Atribuição manual</span>
        <div class="segmented" role="group" aria-label="Tipo de atribuição"><button type="button" data-assign-mode="ind" aria-pressed="${!W.equipeId}">Instaladores</button><button type="button" data-assign-mode="team" aria-pressed="${!!W.equipeId}">Equipe</button></div>
        ${W.equipeId || W._teamMode ? `<select class="select" id="fTeam"><option value="">Escolha a equipe…</option>${teams.map(t => `<option value="${h(t.id)}" ${W.equipeId === t.id ? "selected" : ""}>${h(t.nome)} (${t.membros.length})</option>`).join("")}</select>`
        : `<div class="chip-row">${actives.map(i => { const st = C.installerStatus(i, c, c.events); return `<button type="button" class="chip" data-inst="${h(i.id)}" aria-pressed="${(W.instaladorIds || []).includes(i.id)}">${h(i.nome)} <span class="n">${h(st.label)}</span></button>`; }).join("") || `<span class="small muted">Cadastre instaladores em “Instaladores”.</span>`}</div>`}
      </div></div>`;
  }
  function recHTML() {
    const r = recState;
    if (!r) return "";
    const c = A.getCtx();
    const sel = id => (W.equipeId ? W.equipeId === id : (W.instaladorIds || []).join() === id);
    let out = r.candidatos.length ? r.candidatos.map((x, i) => `<div class="cand ${sel(x.kind === "equipe" ? x.id : x.members.join()) ? "sel" : ""}">
      <div class="score">${x.score}<small>/100</small></div>
      <div class="stack tight"><div class="row wrap"><b>${i === 0 ? "Recomendado: " : ""}${h(x.nome)}</b>${x.kind === "equipe" ? badge("accent", "Equipe") : ""}${badge(x.confianca === "alta" ? "success" : x.confianca === "média" ? "info" : "warning", "Confiança " + x.confianca)}</div>
        <div class="tiny muted">${x.data ? `Disponível ${h(A.relDay(x.data, c.today).toLowerCase())} (${C.fmtDate(x.data)})` : ""}${x.estimativa && x.estimativa.horas ? ` · ${C.fmtNum(x.estimativa.horas)} h estimadas` : ""}${x.km != null ? ` · ${C.fmtNum(x.km)} km em linha reta` : ""}</div>
        <ul class="reasons">${x.reasons.map(t => `<li>${h(t)}</li>`).join("")}</ul>
        ${x.fatoresAusentes.length ? `<div class="tiny faint">Sem dados de ${x.fatoresAusentes.map(f => ({ proximity: "localização", productivity: "produtividade", history: "histórico" }[f])).join(", ")} — peso redistribuído.</div>` : ""}</div>
      <div class="cand-act"><button class="btn ${i === 0 ? "primary" : ""} sm" type="button" data-pick="${i}">Escolher</button></div></div>`).join("")
      : `<div class="issue tone-warning">${ic("triangle-alert", 16)}<span>Nenhum instalador cumpre todos os requisitos${W.agenda.inicio ? " nesta data" : ""}. Veja os motivos abaixo, tente outra data ou atribua manualmente.</span></div>`;
    if (r.rejeitados.length) out += `<details><summary class="small muted" style="cursor:pointer">Descartados (${r.rejeitados.length})</summary><div class="stack tight" style="margin-top:8px">${r.rejeitados.map(x => `<div class="small"><b>${h(x.nome)}</b>: ${h(x.motivos.join("; "))}${x.proximaData ? ` — livre a partir de ${C.fmtDate(x.proximaData)}` : ""}</div>`).join("")}</div></details>`;
    out += `<p class="tiny faint">Pesos: especialidade ${r.pesos.expertise}%, disponibilidade ${r.pesos.availability}%, proximidade ${r.pesos.proximity}%, produtividade ${r.pesos.productivity}%, histórico ${r.pesos.history}%. Distâncias só aparecem quando as duas obras têm localização definida e são em linha reta, não tempo de trajeto.</p>`;
    return out;
  }
  /* ---------- step 4: readiness ---------- */
  function stepProntidao() {
    const c = A.getCtx(), req = (c.cfg.readinessRequired || {})[W.tipo] || [];
    const rd = C.readiness(W, c);
    return `<div class="stack"><p class="small muted">Itens obrigatórios para “${W.tipo === "manutencao" ? "manutenção" : "instalação"}” são definidos em Configurações. A obra pode ficar agendada de forma provisória enquanto algo estiver pendente.</p>
      <div class="card pad stack tight">${C.READINESS.map(r => `<label class="check"><input type="checkbox" data-ready-w="${r.id}" ${W.prontidao[r.id] ? "checked" : ""}> ${h(r.label)} ${req.includes(r.id) ? '<span class="tiny muted">(obrigatório)</span>' : ""}</label>`).join("")}</div>
      <div id="rdState">${readyBadge(rd)}</div></div>`;
  }
  const readyBadge = rd => badge({ pronta: "success", pendente: "warning", bloqueada: "danger", na: "neutral" }[rd.state], { pronta: "Pronta para execução", pendente: "Pendente: " + rd.missing.join(", "), bloqueada: "Bloqueada: " + rd.missing.join(", "), na: "—" }[rd.state]);
  /* ---------- step 5: confirmation ---------- */
  function stepConfirmar() {
    const c = A.getCtx(), al = C.allocate(W, c), a = W.agenda;
    const crew = C.jobMembers(W, c.teams).map(A.instName).join(", ");
    const row = (k, v) => `<tr><td class="muted" style="width:38%">${h(k)}</td><td>${v}</td></tr>`;
    return `<div class="stack"><div class="card table-wrap"><table class="table"><tbody>
      ${row("Cliente", h(W.cliente || "—") + (W.fone ? ` · ${h(W.fone)}` : ""))}
      ${row("Endereço", h([W.endereco.completo, W.endereco.bairro].filter(Boolean).join(" — ") || "Não informado"))}
      ${row("Serviço", `${W.tipo === "manutencao" ? "Manutenção" : "Instalação"}${W.servico ? " · " + h(W.servico) : ""}`)}
      ${row("Materiais", h(A.matsLabel(W) || "Não informado"))}
      ${row("Início", a.inicio ? h(A.longDay(a.inicio)) + (a.hora ? ", " + h(a.hora) : "") : "Sem data (fica em “Para marcar data”)")}
      ${row("Término previsto", al.fim ? `${h(C.fmtDate(al.fim))} · ${al.blocks.length} dia(s), ${C.fmtNum(al.horas)} h` : "—")}
      ${row("Instaladores", h(crew || "Nenhum"))}
      ${row("Situação", h((C.STATUS[W.status] || C.STATUS.agendada).label))}
      ${row("Prontidão", readyBadge(C.readiness(W, c)))}</tbody></table></div>
      <div class="field" id="whyWrap" hidden><label for="fWhy">Justificativa para confirmar com conflito *</label><textarea class="textarea" id="fWhy" placeholder="Ex.: cliente pediu esta data; a equipe vai estender o expediente"></textarea></div></div>`;
  }

  /* ---------- live validation ---------- */
  function renderCheck() {
    const box = dlg && $("#wzCheck", dlg);
    if (!box) return;
    const c = A.getCtx();
    const probe = { ...W, id: original ? original.id : "__novo__", status: W.status === "rascunho" ? "agendada" : W.status };
    const issues = C.validateJob(probe, c);
    const al = C.allocate(probe, c);
    box.innerHTML = `<span class="label">Validação da agenda</span>` + (al.fim ? `<p class="small muted">Ocupa ${al.blocks.map(b => `${A.shortDay(b.date)} ${C.fromMin(b.start)}–${C.fromMin(b.end)}`).join(" · ")}</p>` : "") +
      (issues.length ? issues.map(A.issueHTML).join("") : `<div class="issue tone-success">${ic("circle-check", 16)}<span>${al.blocks.length ? "Sem conflitos de agenda." : "Sem data ou duração: nada reservado ainda."}</span></div>`);
    const ww = $("#whyWrap", dlg);
    if (ww) ww.hidden = !C.hasErrors(issues);
    return issues;
  }

  /* ---------- binding ---------- */
  function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]] = o[ks[i]] || {}; o[ks[ks.length - 1]] = val; }
  function bind() {
    $$("[data-k]", dlg).forEach(el => el.addEventListener("input", () => { setPath(W, el.dataset.k, el.dataset.num !== undefined ? Math.max(1, Number(el.value) || 1) : el.value); if (step === 2) { recState = null; const rb = $("#recBox", dlg); if (rb) rb.innerHTML = `<p class="small muted">Dados alterados — clique em “Recalcular”.</p>`; renderCheck(); } }));
    $$("[data-kb]", dlg).forEach(el => el.addEventListener("change", () => { W[el.dataset.kb] = el.checked; }));
    const coord = $("#fCoord", dlg);
    if (coord) coord.addEventListener("change", () => {
      const p = C.parseCoords(coord.value), hint = $("#coordHint", dlg);
      if (!coord.value.trim()) { W.endereco.lat = null; W.endereco.lng = null; hint.textContent = "Opcional."; return; }
      if (!p) { hint.textContent = "Não reconheci coordenadas. Cole o link do Google Maps do local (com @lat,lng) ou “-3.10, -60.02”."; hint.style.color = "var(--danger-text)"; return; }
      W.endereco.lat = p.lat; W.endereco.lng = p.lng; W.endereco.coordFonte = "manual";
      hint.style.color = ""; hint.textContent = p.dentroDeManaus ? "Localização definida." : "Localização definida — parece estar fora de Manaus, confira.";
    });
    $$("[data-it]", dlg).forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
      const i = Number(el.closest("[data-item]").dataset.item), k = el.dataset.it, it = W.itens[i];
      if (k === "qtd") it.qtd = el.value === "" ? null : Number(el.value);
      else it[k] = el.value;
      if (k === "mat") { it.label = it.mat && it.mat !== "outro" ? C.MAT[it.mat].label : ""; it.unidade = it.mat ? C.MAT[it.mat].unit : it.unidade; it.unidadeInferida = false; renderAll(); }
      if (k === "unidade") it.unidadeInferida = false;
    }));
    const man = $("#fManual", dlg);
    if (man) {
      man.addEventListener("change", () => { W.agenda.horasManual = man.checked; $("#manualWrap", dlg).hidden = !man.checked; if (!man.checked) W.agenda.horas = null; else W.agenda.horas = Number($("#fHoras", dlg).value) || null; recState = null; renderCheck(); });
      $("#fHoras", dlg).addEventListener("input", e => { W.agenda.horas = Number(e.target.value) || null; renderCheck(); });
    }
    const team = $("#fTeam", dlg);
    if (team) team.addEventListener("change", () => { W.equipeId = team.value || null; W.instaladorIds = []; renderCheck(); });
    $$("[data-ready-w]", dlg).forEach(el => el.addEventListener("change", () => { W.prontidao[el.dataset.readyW] = el.checked; $("#rdState", dlg).innerHTML = readyBadge(C.readiness(W, A.getCtx())); }));
  }

  function validateStep(target) {
    if (step === 0 && target > 0 && !W.cliente.trim()) { const e = $("#errCli", dlg); e.hidden = false; e.textContent = "Informe o nome do cliente."; $("#fCli", dlg).setAttribute("aria-invalid", "true"); $("#fCli", dlg).focus(); return false; }
    return true;
  }

  document.addEventListener("click", async e => {
    if (!dlg || !dlg.contains(e.target)) return;
    const t = e.target;
    let x;
    if ((x = t.closest("[data-step-go]"))) { const n = Number(x.dataset.stepGo); if (n <= step || validateStep(n)) { step = n; renderAll(); } return; }
    if (t.closest("[data-next]")) { if (validateStep(step + 1)) { step++; renderAll(); } return; }
    if (t.closest("[data-prev]")) { step--; renderAll(); return; }
    if ((x = t.closest("[data-set]"))) { const k = x.dataset.set, v = x.dataset.v; W[k] = x.dataset.toggle !== undefined && W[k] === v ? "" : v; if (k === "tipo") dlg.querySelector(".modal-head h2").textContent = original ? (v === "manutencao" ? "Editar manutenção" : "Editar obra") : (v === "manutencao" ? "Nova manutenção" : "Nova obra"); renderAll(); return; }
    if (t.closest("[data-add-item]")) { W.itens.push({ mat: "", qtd: null, unidade: "m²" }); renderAll(); return; }
    if ((x = t.closest("[data-rm-item]"))) { W.itens.splice(Number(x.dataset.rmItem), 1); renderAll(); return; }
    if ((x = t.closest("[data-assign-mode]"))) { if (x.dataset.assignMode === "team") { W._teamMode = true; } else { W._teamMode = false; W.equipeId = null; } renderAll(); return; }
    if ((x = t.closest("[data-inst]"))) { const id = x.dataset.inst, s = new Set(W.instaladorIds || []); s.has(id) ? s.delete(id) : s.add(id); W.instaladorIds = [...s]; W.equipeId = null; x.setAttribute("aria-pressed", String(s.has(id))); renderCheck(); return; }
    if (t.closest("[data-recommend]")) {
      if (!C.jobMaterials(W).length) { A.toast("Escolha o material na etapa Serviço para calcular sugestões.", true); return; }
      const probe = { ...W, id: original ? original.id : "__novo__", instaladorIds: [], equipeId: null };
      recState = C.recommend(probe, A.getCtx(), 3);
      $("#recBox", dlg).innerHTML = recHTML();
      return;
    }
    if ((x = t.closest("[data-pick]"))) {
      const cand = recState.candidatos[Number(x.dataset.pick)];
      if (cand.kind === "equipe") { W.equipeId = cand.id; W.instaladorIds = []; W._teamMode = true; } else { W.equipeId = null; W.instaladorIds = [...cand.members]; W._teamMode = false; }
      if (!W.agenda.inicio && cand.data) W.agenda.inicio = cand.data;
      W._recomendacao = { at: new Date().toISOString(), escolhido: cand.nome, score: cand.score, posicao: Number(x.dataset.pick) + 1 };
      renderAll(); A.toast(`${cand.nome} atribuído${W.agenda.inicio === cand.data ? ` para ${C.fmtDate(cand.data)}` : ""}.`);
      return;
    }
    if ((x = t.closest("[data-save]"))) save(x.dataset.save, x);
  });

  async function save(kind, btn) {
    if (!W.cliente.trim()) { step = 0; renderAll(); validateStep(1); return; }
    const c = A.getCtx();
    const body = JSON.parse(JSON.stringify(W));
    delete body._teamMode; delete body.id;
    const rec = body._recomendacao; delete body._recomendacao;
    if (kind === "draft") body.status = original && original.status !== "rascunho" ? original.status : "rascunho";
    else if (body.status === "rascunho") body.status = "agendada";
    if (!body.agenda.horasManual) body.agenda.horas = null;
    body.itens = body.itens.filter(i => i.mat);
    const est = C.estimateDuration(body, c);
    if (est.horas) body.estimativa = { horas: est.horas, origem: est.origem, at: new Date().toISOString() };
    let issues = [];
    if (kind === "confirm") {
      issues = C.validateJob({ ...body, id: original ? original.id : "__novo__" }, c);
      if (C.hasErrors(issues)) {
        if (step !== 4) { step = 4; renderAll(); A.toast("Existem conflitos de agenda. Revise antes de confirmar.", true); return; }
        const why = ($("#fWhy", dlg) || {}).value || "";
        if (why.trim().length < 5) { A.toast("Escreva uma justificativa para confirmar com conflito.", true); $("#fWhy", dlg).focus(); return; }
        body.overrides = [...(body.overrides || []), { at: new Date().toISOString(), por: A.S.uid || null, motivo: why.trim(), conflitos: issues.filter(i => i.severity === "erro").map(i => i.msg) }];
      }
    }
    const histTxt = original ? changeSummary(original, body) : (body.status === "rascunho" ? "Rascunho criado" : "Obra cadastrada");
    body.hist = [...(body.hist || []), { t: new Date().toISOString(), txt: histTxt + (rec ? ` · sugestão aceita: ${rec.escolhido} (${rec.score}/100, ${rec.posicao}º)` : "") }].slice(-40);
    btn.disabled = true;
    try {
      await A.Store.saveJob(original ? original.id : null, body, original ? { expectedAtualizado: original.atualizado } : {});
      A.toast(kind === "draft" ? "Rascunho salvo." : original ? "Alterações salvas." : "Obra criada e adicionada à agenda.");
      dlg.close();
    } catch (e) {
      if (e.code === "stale") {
        if (await A.confirmDialog("Outra pessoa alterou esta obra enquanto você editava. Salvar mesmo assim vai substituir as alterações dela.", "Substituir mesmo assim", true)) {
          await A.guard(() => A.Store.saveJob(original.id, body, { force: true }), "Alterações salvas.");
          dlg && dlg.close();
        }
      } else A.toast(e.message || "Não foi possível salvar.", true);
    } finally { if (btn) btn.disabled = false; }
  }
  function changeSummary(o, n) {
    const ch = [];
    if (o.status !== n.status) ch.push(`situação: ${(C.STATUS[n.status] || {}).label}`);
    if ((o.agenda || {}).inicio !== n.agenda.inicio) ch.push(`início: ${n.agenda.inicio ? C.fmtDate(n.agenda.inicio) : "sem data"}`);
    if ((o.instaladorIds || []).join() !== (n.instaladorIds || []).join() || o.equipeId !== n.equipeId) ch.push("instaladores alterados");
    if (JSON.stringify(o.itens) !== JSON.stringify(n.itens)) ch.push("materiais");
    return ch.length ? "Alterado: " + ch.join("; ") : "Dados atualizados";
  }
})();
</script>
<script>/* Operational views: Central de Obras, Instalações/Manutenções lists, Agenda Semanal. */
(function () {
  "use strict";
  const A = window.App, C = A.C, Store = A.Store, S = A.S, { $, $$, h, ic, badge } = A;
  const ui = A.ui;
  ui.central = { filter: null };
  ui.list = { instalacao: { view: "status", inst: "", q: "", done: false }, manutencao: { view: "status", inst: "", q: "", done: false } };
  ui.agenda = { view: null, date: null, inst: "", team: "", mat: "", tipo: "" };

  const open = j => !["concluida", "cancelada"].includes(j.status);
  const isEmObra = st => st.code === "em_obra" || st.code === "em_obra_escritorio";

  /* =========================== CENTRAL DE OBRAS =========================== */
  const METRICS = [
    { k: "disp", label: "Instaladores disponíveis", icon: "user-check", tone: "success", inst: true, test: (s) => s.code === "disponivel" },
    { k: "emobra", label: "Instaladores em obra", icon: "hard-hat", tone: "warning", inst: true, test: s => isEmObra(s) || s.code === "deslocamento" },
    { k: "andamento", label: "Obras em andamento", icon: "hammer", tone: "warning", test: (j) => j.status === "andamento" },
    { k: "agendadas", label: "Obras agendadas", icon: "calendar-days", tone: "info", test: (j, f) => j.status === "agendada" && !!(j.agenda || {}).inicio && !f.atrasada },
    { k: "atrasadas", label: "Obras atrasadas", icon: "clock", tone: "danger", alert: true, test: (j, f) => f.atrasada || f.excedeu },
    { k: "seminst", label: "Obras sem instalador", icon: "user-x", tone: "danger", alert: true, test: (j, f) => open(j) && j.status !== "rascunho" && f.semInstalador },
    { k: "aguardando", label: "Aguardando confirmação", icon: "message-circle", tone: "accent", test: j => j.status === "aguardando" },
    { k: "hoje", label: "Obras previstas para hoje", icon: "sun", tone: "neutral", test: (j, f, c) => open(j) && f.blocks.some(b => b.date === c.today) }
  ];

  A.views.central = function (el) {
    const c = A.getCtx(), evs = c.events || [];
    const statuses = Object.fromEntries((c.installers || []).filter(i => i.ativo !== false).map(i => [i.id, C.installerStatus(i, c, evs)]));
    const flags = Object.fromEntries(c.jobs.map(j => [j.id, C.jobFlags(j, c)]));
    const count = m => m.inst ? Object.values(statuses).filter(m.test).length : c.jobs.filter(j => m.test(j, flags[j.id], c)).length;
    const F = ui.central.filter;
    let html = `<div class="stack loose">`;
    if (c.virtual) html += migrationBanner();
    if (!c.jobs.length && !(c.installers || []).length) html += `<div class="card">${A.emptyHTML("layout-dashboard", "Nenhuma obra ou instalador cadastrado ainda", "Comece cadastrando os instaladores (com os materiais que cada um instala) e depois as obras.", "Nova obra")}</div>`;
    html += `<div class="stats">${METRICS.map(m => { const n = count(m); return `<button type="button" class="stat${m.alert && n ? " alert" : ""}" data-metric="${m.k}" aria-pressed="${F === m.k}"><span class="stat-icon si-${m.tone}">${ic(m.icon, 17)}</span><span><span class="stat-value">${n}</span><span class="stat-label" style="display:block">${h(m.label)}</span></span></button>`; }).join("")}</div>`;
    if (F) {
      const m = METRICS.find(x => x.k === F);
      if (m.inst) {
        const list = (c.installers || []).filter(i => statuses[i.id] && m.test(statuses[i.id]));
        html += `<section class="card"><div class="card-head"><h2 class="h-section">${h(m.label)} (${list.length})</h2><button class="btn ghost sm" type="button" data-metric="${F}">${ic("x", 14)}Limpar filtro</button></div>${list.length ? `<div>${list.map(i => teamRow(i, statuses[i.id], c)).join("")}</div>` : `<div class="card-body small muted">Nenhum instalador nesta situação.</div>`}</section>`;
      } else {
        const list = c.jobs.filter(j => m.test(j, flags[j.id], c)).sort(byStart);
        html += `<section class="stack"><div class="sec-head"><h2>${h(m.label)} (${list.length})</h2><button class="btn ghost sm" type="button" data-metric="${F}">${ic("x", 14)}Limpar filtro</button></div>${list.length ? `<div class="card-grid">${list.map(j => A.jobCard(j, c)).join("")}</div>` : `<div class="card card-body small muted">Nenhuma obra nesta situação.</div>`}</section>`;
      }
    }
    // A. Equipe de hoje
    const actives = (c.installers || []).filter(i => i.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    html += `<section class="card"><div class="card-head"><h2 class="h-section row">${ic("hard-hat", 16)} Equipe de hoje</h2><span class="small muted">${A.longDay(c.today)}</span></div>
      ${actives.length ? `<div>${actives.map(i => teamRow(i, statuses[i.id], c)).join("")}</div>` : `<div class="card-body">${A.emptyHTML("hard-hat", "Nenhum instalador cadastrado", "Cadastre a equipe em “Instaladores”.")}</div>`}</section>`;
    // B. upcoming + C. alerts
    const upcoming = c.jobs.filter(j => open(j) && j.status !== "rascunho" && (j.agenda || {}).inicio && j.agenda.inicio >= c.today && j.status !== "andamento").sort(byStart).slice(0, 10);
    const conflicts = C.validateAll(c);
    const alerts = A.activeAlerts(c);
    const dis = (S.alertState && S.alertState.dispensados) || {};
    const sugs = C.buildSuggestions(c).filter(s => !dis["sug:" + s.key]).slice(0, 8);
    html += `<div class="grid-2">
      <section class="card"><div class="card-head"><h2 class="h-section row">${ic("calendar-check", 16)} Próximas obras</h2><a class="btn ghost sm" href="#agenda">Agenda semanal ${ic("chevron-right", 14)}</a></div>
        ${upcoming.length ? `<div class="rows">${upcoming.map(j => upcomingRow(j, c, conflicts[j.id])).join("")}</div>` : `<div class="card-body small muted">Nenhuma obra agendada a partir de hoje.</div>`}</section>
      <div class="stack">
        <section class="card"><div class="card-head"><h2 class="h-section row">${ic("triangle-alert", 16)} Alertas operacionais</h2><span class="small muted">${alerts.length}</span></div>
          ${alerts.length ? `<div class="rows">${alerts.slice(0, 10).map(A.alertRow).join("")}</div>${alerts.length > 10 ? `<div class="card-body tiny muted">+${alerts.length - 10} no sino de alertas.</div>` : ""}` : `<div class="card-body small muted">${ic("circle-check", 15)} Nada precisa de atenção agora.</div>`}</section>
        <section class="card"><div class="card-head"><h2 class="h-section row">${ic("lightbulb", 16)} Sugestões de otimização</h2></div>
          ${sugs.length ? `<div class="rows">${sugs.map(s => sugRow(s)).join("")}</div>` : `<div class="card-body small muted">Sem sugestões no momento. Elas aparecem quando os dados mostram uma melhoria concreta.</div>`}</section>
      </div></div>`;
    el.innerHTML = html + `</div>`;
  };
  function byStart(a, b) { return String((a.agenda || {}).inicio || "9999").localeCompare(String((b.agenda || {}).inicio || "9999")) || ((C.PRIORITY[a.prio] || { n: 3 }).n - (C.PRIORITY[b.prio] || { n: 3 }).n); }
  function teamRow(i, st, c) {
    const job = st.jobId && c.jobsById[st.jobId];
    const al = job ? C.allocate(job, c) : null;
    const todayBlk = al ? al.blocks.find(b => b.date === c.today) : null;
    const last = st.lastEvent;
    const conf = st.confirmed ? `Check-in ${C.fmtTs(st.since).split(" às ")[1] ? "às " + C.fmtTs(st.since).split(" às ")[1] : ""}${C.tsParts(st.since).date !== c.today ? " de " + C.fmtDate(C.tsParts(st.since).date) : ""}` : (last ? `Última atualização: ${C.fmtTs(last.at)}` : "Sem check-in");
    return `<div class="team-row">
      <div class="row" style="gap:10px"><span class="avatar">${h(A.initials(i.nome))}</span><div class="stack" style="gap:2px"><b class="small">${h(i.nome)}</b>${badge(st.tone, st.label, true)}</div></div>
      <div class="tr-job stack" style="gap:2px">${job ? `<button type="button" class="btn ghost sm" style="justify-content:flex-start;padding:0;min-height:0;height:auto" data-open="${h(job.id)}"><b>${h(job.cliente)}</b></button><span class="tiny muted">${h([job.endereco && job.endereco.bairro, job.tipo === "manutencao" ? "Manutenção" : A.matsLabel(job).split(" · ")[0]].filter(Boolean).join(" · "))}</span>` : `<span class="small muted">${st.code === "indisponivel" ? h(st.motivo || st.label) : "Sem obra hoje"}</span>`}</div>
      <div class="tr-extra stack" style="gap:2px"><span class="tiny">${todayBlk ? `${C.fromMin(todayBlk.start)}–${C.fromMin(todayBlk.end)}` : "—"}</span><span class="tiny muted">${al && al.fim ? "Término " + C.fmtDate(al.fim) : ""}</span></div>
      <div class="stack" style="gap:2px;align-items:flex-end"><span class="tiny ${st.confirmed ? "" : "muted"}">${h(conf)}</span><span class="tiny muted">${st.confirmed ? "Confirmado pelo instalador" : "Localização não confirmada"}</span></div></div>`;
  }
  function upcomingRow(j, c, issues) {
    const crew = A.crewLabel(j, c);
    const pr = C.PRIORITY[j.prio];
    return `<button type="button" class="rowitem" data-open="${h(j.id)}">${A.dateTile(j, c)}
      <span class="grow stack" style="gap:2px"><span class="row" style="gap:6px"><b class="small truncate">${h(j.cliente)}</b>${pr ? badge(pr.tone, pr.label) : ""}</span>
      <span class="tiny muted truncate">${h([A.relDay(j.agenda.inicio, c.today) + (j.agenda.hora ? " " + j.agenda.hora : ""), crew || "Sem instalador", j.endereco && j.endereco.bairro].filter(Boolean).join(" · "))}</span></span>
      ${issues && C.hasErrors(issues) ? badge("danger", "Conflito") : !crew ? badge("danger", "Sem instalador") : C.readiness(j, c).state === "bloqueada" ? badge("warning", "Não pronta") : ""}</button>`;
  }
  function sugRow(s) {
    return `<div class="rowitem" style="cursor:default"><span class="ic si-accent">${ic("lightbulb", 16)}</span><span class="grow small">${h(s.texto)}</span>
      <span class="row" style="gap:4px">${A.canEdit ? `<button class="btn sm" type="button" data-sug-ok="${h(s.key)}">Aplicar</button>` : ""}<button class="btn ghost icon sm" type="button" data-dismiss="sug:${h(s.key)}" title="Dispensar" aria-label="Dispensar sugestão">${ic("x", 14)}</button></span></div>`;
  }
  async function applySuggestion(key) {
    const c = A.getCtx(), s = C.buildSuggestions(c).find(x => x.key === key);
    if (!s) return;
    const job = c.jobsById[s.jobId];
    if (s.tipo === "antecipar") return A.moveDialog(job.id, { date: s.data });
    if ((s.tipo === "atribuir" || s.tipo === "conflito") && s.unit) {
      const probe = { ...job, equipeId: s.unit.kind === "equipe" ? s.unit.id : null, instaladorIds: s.unit.kind === "equipe" ? [] : s.unit.members, agenda: { ...(job.agenda || {}), inicio: (job.agenda || {}).inicio && s.tipo === "atribuir" && (job.agenda || {}).inicio === s.data ? job.agenda.inicio : s.data } };
      const issues = C.validateJob(probe, c);
      if (C.hasErrors(issues)) return A.moveDialog(job.id, { date: s.data, inst: s.unit.members[0] });
      if (!(await A.confirmDialog(`Atribuir ${s.unit.kind === "equipe" ? "a equipe" : ""} ${A.instName(s.unit.members[0])}${s.unit.members.length > 1 && s.unit.kind !== "equipe" ? " e outros" : ""} a ${job.cliente} em ${C.fmtDate(probe.agenda.inicio)}?`, "Aplicar sugestão"))) return;
      await A.guard(() => Store.saveJob(job.id, { equipeId: probe.equipeId, instaladorIds: probe.instaladorIds, agenda: probe.agenda, status: job.status === "rascunho" ? "agendada" : job.status, hist: [...(job.hist || []), { t: new Date().toISOString(), txt: "Sugestão de otimização aplicada: " + s.texto }].slice(-40) }), "Sugestão aplicada.");
      return;
    }
    A.openJob(job.id);
  }
  function migrationBanner() {
    return `<div class="banner tone-warning">${ic("info", 18)}<div class="stack tight grow"><b>Atualização de dados disponível</b><span class="small">As obras da agenda antiga estão sendo exibidas como prévia, sem edição. A atualização cria os perfis dos instaladores, organiza materiais e quantidades e guarda uma cópia de segurança antes de qualquer mudança.</span>
      ${S.role === "admin" ? `<div><button class="btn primary sm" type="button" data-migrate>${ic("rotate-ccw-clock", 15)}Revisar e atualizar dados</button></div>` : `<span class="small">Peça ao administrador (dono da página) para executar a atualização.</span>`}</div></div>`;
  }
  A.migrationBanner = migrationBanner;

  /* =========================== INSTALAÇÕES / MANUTENÇÕES =========================== */
  function listView(tipo) {
    return function (el, opts) {
      const st = ui.list[tipo];
      const man = tipo === "manutencao";
      if (opts.routeChanged || !$("#lstOut", el)) {
        el.innerHTML = `<div class="stack loose">${A.getCtx().virtual ? migrationBanner() : ""}
          <div class="page-head"><div><h2 class="h-title">${man ? "Manutenções" : "Instalações"}</h2><p>${man ? "Retornos para retirar e recolocar peças, liberar acesso a encanamento ou elétrica e outros reparos." : "Todas as obras de instalação, organizadas por situação ou por instalador."}</p></div>
            ${A.canEdit ? `<button class="btn primary" type="button" data-new-tipo="${tipo}">${ic("plus", 16)}${man ? "Nova manutenção" : "Nova obra"}</button>` : ""}</div>
          <div class="card pad row wrap" style="padding:11px;gap:9px">
            <div class="segmented" role="group" aria-label="Organizar por"><button type="button" data-lview="status">Por situação</button><button type="button" data-lview="instalador">Por instalador</button></div>
            <select class="select sm" id="lstInst" aria-label="Instalador" style="width:auto;min-width:180px"></select>
            <div class="input-icon grow" style="min-width:200px">${ic("search", 16)}<input class="input sm" type="search" id="lstQ" placeholder="Buscar cliente, material, bairro…" aria-label="Buscar" value="${h(st.q)}"></div>
            <button type="button" class="chip" id="lstDone">Mostrar concluídas</button></div>
          <div id="lstOut" class="stack loose"></div></div>`;
        $("#lstQ", el).addEventListener("input", e => { st.q = e.target.value; update(); });
        $("#lstInst", el).addEventListener("change", e => { st.inst = e.target.value; update(); });
        $("#lstDone", el).addEventListener("click", () => { st.done = !st.done; update(); });
        $$("[data-lview]", el).forEach(b => b.addEventListener("click", () => { st.view = b.dataset.lview; update(); }));
      }
      update();
      function update() {
        const c = A.getCtx();
        $$("[data-lview]", el).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lview === st.view)));
        $("#lstDone", el).setAttribute("aria-pressed", String(st.done));
        const sel = $("#lstInst", el);
        sel.innerHTML = `<option value="">Todos os instaladores</option>${(c.installers || []).map(i => `<option value="${h(i.id)}">${h(i.nome)}</option>`).join("")}<option value="__none">Sem instalador</option>`;
        sel.value = [...sel.options].some(o => o.value === st.inst) ? st.inst : "";
        const q = C.norm(st.q);
        const items = c.jobs.filter(j => (j.tipo || "instalacao") === tipo && j.status !== "cancelada" && (st.done || j.status !== "concluida")
          && (!st.inst || (st.inst === "__none" ? !(j._members || []).length : (j._members || []).includes(st.inst)))
          && (!q || C.norm([j.cliente, j.servico, A.matsLabel(j), j.endereco && j.endereco.bairro, j.endereco && j.endereco.completo, A.crewLabel(j, c), j.obs].join(" ")).includes(q))).sort(byStart);
        const out = $("#lstOut", el);
        const all = c.jobs.filter(j => (j.tipo || "instalacao") === tipo);
        if (!all.length) { out.innerHTML = `<div class="card">${A.emptyHTML(man ? "wrench" : "hammer", man ? "Nenhuma manutenção cadastrada" : "Nenhuma obra cadastrada", man ? "Registre aqui os retornos para retirar e recolocar peças e outros reparos." : "Cadastre a primeira com o cliente, o material e a data prevista.", man ? "Cadastrar manutenção" : "Cadastrar obra")}</div>`; return; }
        if (!items.length) { out.innerHTML = `<div class="card">${A.emptyHTML("search", "Nenhuma obra encontrada", "Mude a busca ou o filtro de instalador.")}</div>`; return; }
        const group = (t, list) => list.length ? `<section class="stack"><div class="row"><h3 class="eyebrow">${h(t)}</h3>${badge("neutral", String(list.length))}</div><div class="card-grid">${list.map(j => A.jobCard(j, c)).join("")}</div></section>` : "";
        let html = "";
        if (st.view === "status") {
          const fl = j => C.jobFlags(j, c);
          html += group("Rascunhos", items.filter(j => j.status === "rascunho"));
          html += group("Em andamento", items.filter(j => j.status === "andamento"));
          html += group("Início atrasado", items.filter(j => fl(j).atrasada));
          html += group("Aguardando confirmação", items.filter(j => j.status === "aguardando" && !fl(j).atrasada));
          html += group("Para marcar data", items.filter(j => j.status === "agendada" && !(j.agenda || {}).inicio).sort((a, b) => ((C.PRIORITY[a.prio] || { n: 3 }).n - (C.PRIORITY[b.prio] || { n: 3 }).n)));
          html += group("Próximas", items.filter(j => j.status === "agendada" && (j.agenda || {}).inicio && !fl(j).atrasada));
          html += group("Pausadas", items.filter(j => j.status === "pausada"));
          html += group("Concluídas", items.filter(j => j.status === "concluida").reverse());
        } else {
          const keys = [...new Set(items.flatMap(j => (j._members || []).length ? j._members : [""]))].sort((a, b) => !a ? 1 : !b ? -1 : A.instName(a).localeCompare(A.instName(b), "pt-BR"));
          for (const k of keys) html += group(k ? A.instName(k) : "Sem instalador", items.filter(j => k ? (j._members || []).includes(k) : !(j._members || []).length));
        }
        out.innerHTML = html;
      }
    };
  }
  A.views.instalacoes = listView("instalacao");
  A.views.manutencoes = listView("manutencao");

  /* =========================== AGENDA SEMANAL =========================== */
  function displayIndex(c, fromDate, toDate) {
    const idx = {}, unassigned = {};
    for (const j of c.jobs) {
      if (j.status === "cancelada") continue;
      if (j.status === "rascunho" && !(j.agenda || {}).inicio) continue;
      const blocks = j.status === "andamento" ? C.occupyingBlocks(j, c) : C.allocate(j, c).blocks;
      for (const b of blocks) {
        if (b.date < fromDate || b.date > toDate) continue;
        const ms = j._members || [];
        if (!ms.length) (unassigned[b.date] = unassigned[b.date] || []).push({ j, b });
        for (const m of ms) ((idx[m] = idx[m] || {})[b.date] = idx[m][b.date] || []).push({ j, b });
      }
    }
    return { idx, unassigned };
  }
  function blkHTML(j, b, conflictIds, opts) {
    const cls = `blk s-${j.status}${conflictIds.has(j.id) ? " conflict" : ""}`;
    const drag = A.canEdit && !A.getCtx().virtual && !A.isMobile() && ["agendada", "aguardando", "rascunho", "pausada"].includes(j.status);
    const pr = C.PRIORITY[j.prio];
    return `<button type="button" class="${cls}" data-open="${h(j.id)}" ${drag ? `draggable="true" data-drag="${h(j.id)}"` : ""} title="${h(j.cliente)} — ${h((C.STATUS[j.status] || {}).label)}${conflictIds.has(j.id) ? " — conflito" : ""}" ${opts && opts.style ? `style="${opts.style}"` : ""}>
      <b>${pr && j.prio === "alta" ? "● " : ""}${h(j.cliente)}</b><small>${h([C.fromMin(b.start) + "–" + C.fromMin(b.end), j.endereco && j.endereco.bairro, j.tipo === "manutencao" ? "Manutenção" : (C.MAT[(j.itens || [])[0] && j.itens[0].mat] || {}).label].filter(Boolean).join(" · "))}</small></button>`;
  }
  A.views.agenda = function (el, opts) {
    const st = ui.agenda;
    if (!st.view) st.view = A.isMobile() ? "dia" : "semana";
    if (!st.date) st.date = C.today();
    if (opts.routeChanged || !$("#agOut", el)) {
      el.innerHTML = `<div class="stack">
        <div class="row between wrap" style="gap:10px">
          <div class="segmented" role="group" aria-label="Visualização"><button type="button" data-agv="dia">Dia</button><button type="button" data-agv="semana">Semana</button><button type="button" data-agv="mes">Mês</button></div>

      $("#agDate", el).addEventListener("change", e => { if (e.target.value) { st.date = e.target.value; draw(); } });
    }

    function draw() {
      const c = A.getCtx();

      $("#agDate", el).value = st.date;
      $("#agInst", el).innerHTML = `<option value="">Todos os instaladores</option>${(c.installers || []).filter(i => i.ativo !== false).map(i => `<option value="${h(i.id)}" ${st.inst === i.id ? "selected" : ""}>${h(i.nome)}</option>`).join("")}`;
      $("#agTeam", el).innerHTML = `<option value="">Todas as equipes</option>${(c.teams || []).map(t => `<option value="${h(t.id)}" ${st.team === t.id ? "selected" : ""}>${h(t.nome)}</option>`).join("")}`;
      $("#agMat", el).value = st.mat; $("#agTipo", el).value = st.tipo;
      const team = st.team && (c.teams || []).find(t => t.id === st.team);
      const rows = (c.installers || []).filter(i => i.ativo !== false && (!st.inst || i.id === st.inst) && (!team || team.membros.includes(i.id))).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
      const jobOk = j => (!st.mat || (j.itens || []).some(i => i.mat === st.mat)) && (!st.tipo || (j.tipo || "instalacao") === st.tipo) && (!team || j.equipeId === team.id || (j._members || []).some(m => team.membros.includes(m)));
      const conflictIds = new Set(Object.entries(C.validateAll(c)).filter(([, v]) => C.hasErrors(v)).map(([k]) => k));
      for (const j of c.jobs) { const f = C.jobFlags(j, c); if (f.atrasada || f.excedeu) conflictIds.add(j.id); }
      const out = $("#agOut", el);
      if (!rows.length && !(c.installers || []).length) { out.innerHTML = `<div class="card">${A.emptyHTML("hard-hat", "Cadastre os instaladores primeiro", "A agenda semanal mostra uma linha por instalador.")}</div>`; return; }
      if (st.view === "semana") {
        const ws = C.weekStart(st.date), days = [...Array(7)].map((_, i) => C.addDays(ws, i));
        const { idx, unassigned } = displayIndex(c, days[0], days[6]);
        if (A.isMobile()) { out.innerHTML = weekMobile(c, rows, days, idx, unassigned, jobOk, conflictIds); return; }
        let g = `<div class="board-wrap"><div class="board" style="grid-template-columns:200px repeat(7,minmax(120px,1fr))"><div class="corner tiny muted">Semana ${C.fmtDate(days[0])} – ${C.fmtDate(days[6])}</div>`;
        g += days.map(d => `<div class="bh${d === c.today ? " today" : ""}">${h(A.shortDay(d))}${C.companyDay(c.cfg, d) ? "" : ` <span class="tiny muted">${(c.cfg.holidays || []).some(x => x.date === d) ? "feriado" : "sem expediente"}</span>`}</div>`).join("");
        for (const i of rows) {
          const wl = C.workload(i, c, days[0], 7);
          g += `<div class="rh"><div class="row" style="gap:8px"><span class="avatar">${h(A.initials(i.nome))}</span><b class="small truncate">${h(i.nome)}</b></div><div class="progress ${wl.level}" title="${wl.pct}% da capacidade da semana"><span style="width:${Math.min(100, wl.pct)}%"></span></div><span class="tiny muted">${C.fmtNum(wl.ocupadoH)} h de ${C.fmtNum(wl.capacidadeH)} h · ${wl.pct}%</span></div>`;
          for (const d of days) g += cellHTML(c, i, d, (idx[i.id] || {})[d] || [], jobOk, conflictIds);
        }
        const un = days.map(d => (unassigned[d] || []).filter(x => jobOk(x.j)));
        if (un.some(x => x.length)) {
          g += `<div class="rh"><b class="small" style="color:var(--danger-text)">Sem instalador</b><span class="tiny muted">Arraste para um instalador</span></div>`;
          g += un.map((list, k) => `<div class="cell" data-cell-un="${days[k]}">${list.map(x => blkHTML(x.j, x.b, conflictIds)).join("")}</div>`).join("");

              ${!day || blk ? `<span class="offlabel" style="position:absolute;left:8px;top:18px">${h(blk ? (blk.motivo || blk.tipo) : "Folga")}</span>` : ""}
              ${list.map(x => blkHTML(x.j, x.b, conflictIds, { style: `left:${pct(x.b.start)}%;width:${Math.max(6, pct(x.b.end) - pct(x.b.start))}%` })).join("")}
              ${day && !blk && A.canEdit && !list.length ? `<button class="btn ghost sm" type="button" data-newslot="${h(i.id)}|${d}" style="position:absolute;right:6px;top:12px">${ic("plus", 14)}Livre — criar obra</button>` : ""}</div></div>`;
        }
        const un = (unassigned[d] || []).filter(x => jobOk(x.j));
        if (un.length) html += `<div class="team-row day-row"><b class="small" style="color:var(--danger-text)">Sem instalador</b><div class="row wrap">${un.map(x => `<span style="width:200px">${blkHTML(x.j, x.b, conflictIds)}</span>`).join("")}</div></div>`;
        out.innerHTML = html + `</div></div>`;
      } else {
        const first = st.date.slice(0, 8) + "01", gridStart = C.weekStart(first);

        const { idx, unassigned } = displayIndex(c, days[0], days[41]);
        const per = {};
        for (const [iid, byDate] of Object.entries(idx)) { if (!rows.some(r => r.id === iid)) continue; for (const [d, list] of Object.entries(byDate)) for (const x of list) if (jobOk(x.j)) (per[d] = per[d] || new Map()).set(x.j.id, x.j); }
        for (const [d, list] of Object.entries(unassigned)) for (const x of list) if (jobOk(x.j) && !st.inst && !team) (per[d] = per[d] || new Map()).set(x.j.id, x.j);
        out.innerHTML = `<div class="month">${["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].map(d => `<div class="tiny muted strong" style="padding:0 4px">${d}</div>`).join("")}${days.map(d => { const list = [...(per[d] || new Map()).values()]; return `<button type="button" class="mday${d.slice(0, 7) !== first.slice(0, 7) ? " out" : ""}${d === c.today ? " today" : ""}" data-gotoday="${d}"><span class="row between"><b class="small">${+d.slice(8)}</b>${list.length ? badge("neutral", String(list.length)) : ""}</span>${list.slice(0, 3).map(j => `<span class="pill" style="border-left-color:var(--${conflictIds.has(j.id) ? "danger" : j.status === "andamento" ? "warning" : j.status === "concluida" ? "success" : j.status === "pausada" ? "pause" : "info"})">${h(j.cliente)}</span>`).join("")}${list.length > 3 ? `<span class="tiny muted">+${list.length - 3}</span>` : ""}</button>`; }).join("")}</div>`;
      }

  };
  function cellHTML(c, inst, d, list, jobOk, conflictIds) {

  }
  function weekMobile(c, rows, days, idx, unassigned, jobOk, conflictIds) {
    let html = `<div class="stack">`;
    for (const i of rows) {
      const wl = C.workload(i, c, days[0], 7);
      html += `<section class="card"><div class="card-head"><div class="row" style="gap:8px"><span class="avatar">${h(A.initials(i.nome))}</span><b>${h(i.nome)}</b></div><span class="tiny muted">${wl.pct}% da semana</span></div><div class="rows">`;
      for (const d of days) {
        const list = ((idx[i.id] || {})[d] || []).filter(x => jobOk(x.j));
        const day = C.installerDay(i, c.cfg, d), blk = C.blockedOn(i, d);
        html += `<div class="rowitem" style="cursor:default;align-items:flex-start${!day || blk ? ";background:var(--unavail)" : ""}"><span class="small strong" style="width:62px;flex:none">${h(A.shortDay(d))}</span><span class="grow stack tight">${list.map(x => blkHTML(x.j, x.b, conflictIds)).join("") || (!day || blk ? `<span class="tiny muted">${h(blk ? (blk.motivo || blk.tipo) : "Folga")}</span>` : A.canEdit ? `<button class="btn ghost sm" type="button" data-newslot="${h(i.id)}|${d}" style="justify-content:flex-start">${ic("plus", 14)}Livre — criar obra</button>` : `<span class="tiny faint">Livre</span>`)}</span></div>`;

    root.addEventListener("drop", e => {
      const cell = e.target.closest("[data-cell],[data-cell-un]"); if (!cell) return;
      e.preventDefault(); cell.classList.remove("drop");
      const id = e.dataTransfer.getData("text/plain");

<script>/* Team and management views: Instaladores, Desempenho, Configurações, Minha Agenda (installer), Quadro (viewer). */

  ui.perf = { range: "30", inst: "" };

  /* =========================== INSTALADORES =========================== */

        ${A.canEdit && !c.virtual ? `<div class="row wrap"><button class="btn" type="button" data-team-new>${ic("users", 16)}Nova equipe</button><button class="btn primary" type="button" data-inst-edit="">${ic("plus", 16)}Novo instalador</button></div>` : ""}</div>

  };
  function instCard(i, st, c) {

  function impactOf(changeFn) {
    const c = A.getCtx();
    const before = C.validateAll(c);
    const data = changeFn({ cfg: c.cfg, installers: c.installers.map(i => ({ ...i })), teams: (c.teams || []).map(t => ({ ...t })), jobs: c.jobs.map(j => { const x = { ...j }; delete x._members; return x; }) });
    const after = C.validateAll(C.buildContext(data, new Date()));
    return Object.keys(after).filter(id => C.hasErrors(after[id]) && !(before[id] && C.hasErrors(before[id]))).map(id => ({ job: c.jobsById[id], issues: after[id].filter(i => i.severity === "erro") }));
  }

          <div class="field span-6"><label for="iBase">Ponto de partida (opcional)</label><input class="input" id="iBase" placeholder="Link do Google Maps ou -3.10, -60.02" value="${C.hasCoords(I.base) ? `${I.base.lat}, ${I.base.lng}` : ""}"><span class="hint">Usado na proximidade só quando o instalador não tem outra obra no dia.</span></div>
